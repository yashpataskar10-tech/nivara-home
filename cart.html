<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Cart | Nivara Home</title>
  <meta name="description" content="Review the items in your Nivara Home cart before checkout." />
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Petrona:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="site-header"></div>

  <main>
    <div class="page-header">
      <div class="wrap">
        <p class="breadcrumb"><a href="index.html">Home</a> / Cart</p>
        <h1>Your Cart</h1>
      </div>
    </div>

    <section class="section">
      <div class="wrap">
        <div id="cart-empty" class="empty-state hidden">
          <p>Your cart is empty.</p>
          <a class="btn btn-primary" href="index.html">Continue Shopping</a>
        </div>

        <div id="cart-full" class="cart-layout hidden">
          <div>
            <table class="cart-table">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Price</th>
                  <th>Quantity</th>
                  <th>Total</th>
                </tr>
              </thead>
              <tbody id="cart-rows"></tbody>
            </table>
            <div class="cart-actions-row">
              <a class="btn btn-outline" href="index.html">Continue Shopping</a>
            </div>
          </div>

          <aside class="order-summary">
            <h3>Order Summary</h3>
            <div class="summary-row"><span>Subtotal</span><span id="summary-subtotal"></span></div>
            <div class="summary-row"><span>Shipping</span><span id="summary-shipping"></span></div>
            <div class="summary-row total"><span>Total</span><span id="summary-total"></span></div>
            <a class="btn btn-primary btn-block mt-lg" href="checkout.html" id="checkout-btn">Proceed to Checkout</a>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="js/products-data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/main.js"></script>
  <script>
    renderHeader("home");
    renderFooter();

    function cartRowHTML(item) {
      return `
        <tr data-sku="${item.sku}">
          <td>
            <div class="cart-product">
              <img src="${item.image}" alt="${item.name}" onerror="this.onerror=null;this.src=placeholderImage('${escapeJs(item.name)}','${escapeJs(item.category)}')" />
              <div>
                <div class="cart-product-name"><a href="products/${item.slug}.html">${item.name}</a></div>
                <div class="cart-product-cat">${item.category}</div>
                <button class="cart-remove" onclick="removeFromCart('${item.sku}'); renderCartPage();">Remove</button>
              </div>
            </div>
          </td>
          <td>${formatPrice(item.price)}</td>
          <td>
            <div class="qty-selector small">
              <button type="button" aria-label="Decrease quantity" onclick="updateCartQty('${item.sku}', ${item.qty - 1}); renderCartPage();">−</button>
              <input type="text" readonly value="${item.qty}" aria-label="Quantity" />
              <button type="button" aria-label="Increase quantity" onclick="updateCartQty('${item.sku}', ${item.qty + 1}); renderCartPage();">+</button>
            </div>
          </td>
          <td>${formatPrice(item.lineTotal)}</td>
        </tr>
      `;
    }

    function renderCartPage() {
      const items = getCartDetails();
      const emptyEl = document.getElementById("cart-empty");
      const fullEl = document.getElementById("cart-full");

      if (items.length === 0) {
        emptyEl.classList.remove("hidden");
        fullEl.classList.add("hidden");
        return;
      }

      emptyEl.classList.add("hidden");
      fullEl.classList.remove("hidden");

      document.getElementById("cart-rows").innerHTML = items.map(cartRowHTML).join("");

      const subtotal = getCartSubtotal();
      const shipping = getShippingCost(subtotal);
      document.getElementById("summary-subtotal").textContent = formatPrice(subtotal);
      document.getElementById("summary-shipping").textContent = shipping === 0 ? "Free" : formatPrice(shipping);
      document.getElementById("summary-total").textContent = formatPrice(subtotal + shipping);
    }

    renderCartPage();
  </script>
</body>
</html>
